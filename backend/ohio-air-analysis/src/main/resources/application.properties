spring.application.name=ohio-air-analysis

# Database Connection Settings (AWS RDS MySQL)
spring.datasource.url=jdbc:mysql://ohio-air-analytics-prod-mysql.copocmkkwxk1.us-east-1.rds.amazonaws.com:3306/ohio_air_analytics?useSSL=true&requireSSL=false&serverTimezone=UTC
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Debug Logging
logging.level.web=DEBUG